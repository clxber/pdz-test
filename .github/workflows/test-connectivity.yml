name: Test Connectivity to bfts.5read.com

on:
  workflow_dispatch:

jobs:
  connectivity-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS resolution
        run: |
          echo "=== DNS lookup ==="
          dig bfts.5read.com +short || nslookup bfts.5read.com

      - name: Test with curl (HEAD)
        run: |
          echo "=== curl HEAD request ==="
          curl -I -m 10 http://bfts.5read.com/pdz/15431837unRegister.pdz

      - name: Test with Python requests (timeout 10s)
        run: |
          echo "=== Python requests HEAD ==="
          python3 -c "
import requests, sys
try:
    r = requests.head('http://bfts.5read.com/pdz/15431837unRegister.pdz', timeout=10)
    print('Status Code:', r.status_code)
    print('Headers:', dict(r.headers))
except Exception as e:
    print('Error:', e)
    sys.exit(1)
"
