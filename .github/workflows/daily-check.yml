name: PDZ 每日自动检测（每天4次，每次5.83小时）

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'    # UTC 0,6,12,18 → 北京 8,14,20,2 点
  workflow_dispatch:

concurrency:
  group: pdz-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04              # 锁定系统版本，避免 Ubuntu 26.04 迁移干扰
    timeout-minutes: 358               # 5.83小时 = 350分钟，留8分钟给 Git 提交

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取最新进度
        run: git pull origin main --rebase

      - name: 运行检测（最多5.83小时）
        run: python check_pdz.py --max-minutes 350

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "更新检测进度 [skip ci]"
          git pull origin main --rebase
          git push

      - name: 上传 Artifact（备选）
        uses: actions/upload-artifact@v7
        with:
          name: valid_links_${{ github.run_id }}
          path: |
            valid_links.txt
            valid_*.txt
