name: PDZ 自动检测（8 分片 + 完成合并 + 无缝触发 + 智能兜底 + 0-6点过滤）

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京 6:00，每天一次兜底
  workflow_dispatch:

concurrency:
  group: pdz-check
  cancel-in-progress: false

jobs:
  # ==================== 健康检查 ====================
  health-check:
    runs-on: ubuntu-26.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 检查是否需要运行
        id: check
        run: |
          BJ_HOUR=$(TZ='Asia/Shanghai' date +%H)

          # ★ 禁止时段：北京 0-6 点，任何触发都拒绝
          if [ "$BJ_HOUR" -ge 0 ] && [ "$BJ_HOUR" -lt 6 ]; then
            echo "🛑 北京 0-6 点（当前北京 ${BJ_HOUR}:00），禁止触发"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🟢 手动/无缝触发，放行"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # 定时兜底
            LAST_COMMIT_TS=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_COMMIT_TS))
            LAST_BJ_HOUR=$(TZ='Asia/Shanghai' date -d @$LAST_COMMIT_TS +%H)

            # 如果最近提交发生在禁止时段内 → 循环可能被时段阻断了，允许兜底触发
            if [ "$LAST_BJ_HOUR" -ge 0 ] && [ "$LAST_BJ_HOUR" -lt 6 ]; then
              echo "🟡 最近提交发生在禁止时段内（北京 ${LAST_BJ_HOUR}:00），允许兜底触发"
              echo "should_run=true" >> $GITHUB_OUTPUT
            elif [ $DIFF -lt 43200 ]; then
              echo "🟢 循环健康运行中（最近12小时内有提交），跳过兜底触发"
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "🔴 循环可能中断，执行兜底触发"
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          fi

  # ==================== 分片 A ====================
  shard-a:
    needs: health-check
    if: needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 358
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: git pull origin main --rebase
      - name: 运行分片 A（1–10441）
        run: python check_pdz.py --shard a --max-minutes 350
      - name: 提交分片 A 进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "分片A进度 [skip ci]"
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true
              break
            fi
            WAIT=$((RANDOM % 21 + 10))
            echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
            sleep $WAIT
          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 10 次，退出。"
            exit 1
          fi

  # ==================== 分片 B ====================
  shard-b:
