          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 10 次，退出。"
            exit 1
          fi

      - name: 重置进度并触发下一轮
        id: check
        run: |
          a_done=$(cat progress_a.txt 2>/dev/null | tr -d '\n' || echo "")
          b_done=$(cat progress_b.txt 2>/dev/null | tr -d '\n' || echo "")
          c_done=$(cat progress_c.txt 2>/dev/null | tr -d '\n' || echo "")
          d_done=$(cat progress_d.txt 2>/dev/null | tr -d '\n' || echo "")
          e_done=$(cat progress_e.txt 2>/dev/null | tr -d '\n' || echo "")
          f_done=$(cat progress_f.txt 2>/dev/null | tr -d '\n' || echo "")
          g_done=$(cat progress_g.txt 2>/dev/null | tr -d '\n' || echo "")
          h_done=$(cat progress_h.txt 2>/dev/null | tr -d '\n' || echo "")
          echo "A=$a_done, B=$b_done, C=$c_done, D=$d_done, E=$e_done, F=$f_done, G=$g_done, H=$h_done"
          if [ "$a_done" = "-1" ] && [ "$b_done" = "-1" ] && [ "$c_done" = "-1" ] && [ "$d_done" = "-1" ] && [ "$e_done" = "-1" ] && [ "$f_done" = "-1" ] && [ "$g_done" = "-1" ] && [ "$h_done" = "-1" ]; then
            echo "✅ 八个分片均已完成，重置进度"
            echo 0 > progress_a.txt
            echo 0 > progress_b.txt
            echo 0 > progress_c.txt
            echo 0 > progress_d.txt
            echo 0 > progress_e.txt
            echo 0 > progress_f.txt
            echo 0 > progress_g.txt
            echo 0 > progress_h.txt
            git add -A
            git diff --staged --quiet || git commit -m "重置进度，开始新一轮 [skip ci]"
            success=false
            for i in $(seq 1 10); do
              if git pull origin main --rebase && git push; then
                success=true
                break
              fi
              WAIT=$((RANDOM % 21 + 10))
              echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
              sleep $WAIT
            done
            if [ "$success" = "false" ]; then
              echo "❌ 重置推送连续失败 10 次，退出。"
              exit 1
            fi
            echo "TRIGGER=true" >> $GITHUB_OUTPUT
          else
            echo "⏳ 尚有分片未完成，等待下次触发"
            echo "TRIGGER=false" >> $GITHUB_OUTPUT
          fi

      - name: 立即触发下一轮（带 0-6 点过滤）
        if: steps.check.outputs.TRIGGER == 'true'
        run: |
          # ★ 北京 0-6 点不触发
          BJ_HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$BJ_HOUR" -ge 0 ] && [ "$BJ_HOUR" -lt 6 ]; then
            echo "🛑 北京 ${BJ_HOUR}:00 在禁止时段（0-6点），跳过触发下一轮"
            echo "   下一轮将由北京 6:00 的定时兜底触发"
            exit 0
          fi
          echo "🟢 北京 ${BJ_HOUR}:00 不在禁止时段，触发下一轮"
          gh workflow run daily-check.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Artifact（备选）
        uses: actions/upload-artifact@v7
        with:
          name: valid_links_${{ github.run_id }}
          path: |
            valid_links.txt
            snapshots/*.txt
