  # ==================== 合并 + 重置 + 触发下一轮 ====================
  merge:
    needs: [health-check, shard-a, shard-b, shard-c, shard-d, shard-e, shard-f, shard-g, shard-h]
    if: always() && needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: git pull origin main --rebase

      - name: 合并分片结果（仅在全部完成时）
        run: python merge_shards.py

      - name: 提交合并结果（如果有改动）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "合并分片结果 [skip ci]"
