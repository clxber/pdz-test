name: PDZ 每日自动检测（每小时一次，每次44分钟）

on:
  schedule:
    - cron: '0 17-23 * * *'    # 北京 1:00-7:00
    - cron: '0 0-15 * * *'     # 北京 8:00-23:59
  workflow_dispatch:

concurrency:
  group: pdz-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取最新进度
        run: git pull origin main --rebase

      - name: 运行检测（最多44分钟）
        run: python check_pdz.py --max-minutes 44

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "更新检测进度 [skip ci]"
          git pull origin main --rebase
          git push

      - name: 上传 Artifact（备选）
        uses: actions/upload-artifact@v7
        with:
          name: valid_links_${{ github.run_id }}
          path: |
            valid_links.txt
            valid_*.txt
