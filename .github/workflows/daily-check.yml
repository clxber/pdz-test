name: PDZ 自动检测（2 分片 + 完成合并 + 无缝触发 + 智能兜底）

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00（北京 8:00）兜底触发一次
  workflow_dispatch:

concurrency:
  group: pdz-check
  cancel-in-progress: false

jobs:
  # ==================== 健康检查 ====================
  health-check:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 检查是否需要运行
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # 定时触发（兜底）
            LAST_COMMIT=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_COMMIT))
            # 8 小时 = 28800 秒
            if [ $DIFF -lt 28800 ]; then
              echo "🟢 循环健康运行中（最近8小时内有提交），跳过本次兜底触发。"
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "🔴 循环可能中断，执行兜底触发。"
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          fi

  # ==================== 分片 A ====================
  shard-a:
    needs: health-check
    if: needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    permissions:
      contents: write    # ★ 显式声明（推荐）
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: git pull origin main --rebase
      - name: 运行分片 A（1–41763）
        run: python check_pdz.py --shard a --max-minutes 350
      - name: 提交分片 A 进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "分片A进度 [skip ci]"
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true
              break
            fi
            WAIT=$((RANDOM % 21 + 10))
            echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
            sleep $WAIT
          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 10 次，退出。"
            exit 1
          fi

  # ==================== 分片 B ====================
  shard-b:
    needs: health-check
    if: needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    permissions:
      contents: write    # ★ 显式声明（推荐）
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: git pull origin main --rebase
      - name: 运行分片 B（41764–最后）
        run: python check_pdz.py --shard b --max-minutes 350
      - name: 提交分片 B 进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "分片B进度 [skip ci]"
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true
              break
            fi
            WAIT=$((RANDOM % 21 + 10))
            echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
            sleep $WAIT
          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 10 次，退出。"
            exit 1
          fi

  # ==================== 合并 + 重置 + 触发下一轮 ====================
  merge:
    needs: [health-check, shard-a, shard-b]
    if: always() && needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # ★★★ 关键修复：补上这一行 ★★★
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: git pull origin main --rebase

      - name: 合并分片结果（仅在两者都完成时）
        run: python merge_shards.py

      - name: 提交合并结果（如果有改动）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "合并分片结果 [skip ci]"
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true
              break
            fi
            WAIT=$((RANDOM % 21 + 10))
            echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
            sleep $WAIT
          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 10 次，退出。"
            exit 1
          fi

      - name: 重置进度并触发下一轮
        id: check
        run: |
          a_done=$(cat progress_a.txt 2>/dev/null | tr -d '\n' || echo "")
          b_done=$(cat progress_b.txt 2>/dev/null | tr -d '\n' || echo "")
          echo "A=$a_done, B=$b_done"
          if [ "$a_done" = "-1" ] && [ "$b_done" = "-1" ]; then
            echo "✅ 两个分片均已完成，重置进度"
            echo 0 > progress_a.txt
            echo 0 > progress_b.txt
            git add -A
            git diff --staged --quiet || git commit -m "重置进度，开始新一轮 [skip ci]"
            success=false
            for i in $(seq 1 10); do
              if git pull origin main --rebase && git push; then
                success=true
                break
              fi
              WAIT=$((RANDOM % 21 + 10))
              echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 10 次）..."
              sleep $WAIT
            done
            if [ "$success" = "false" ]; then
              echo "❌ 重置推送连续失败 10 次，退出。"
              exit 1
            fi
            echo "TRIGGER=true" >> $GITHUB_OUTPUT
          else
            echo "⏳ 尚有分片未完成，等待下次触发"
            echo "TRIGGER=false" >> $GITHUB_OUTPUT
          fi

      - name: 立即触发下一轮
        if: steps.check.outputs.TRIGGER == 'true'
        run: gh workflow run daily-check.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Artifact（备选）
        uses: actions/upload-artifact@v7
        with:
          name: valid_links_${{ github.run_id }}
          path: |
            valid_links.txt
            snapshots/*.txt
